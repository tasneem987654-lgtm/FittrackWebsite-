<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <div class="login-logo">
                <span class="logo-icon">💪</span>
                <h1>FitTrack</h1>
            </div>

            <h2 class="login-subtitle">
                موقع إلكتروني لتتبع اللياقة البدنية ونمط الحياة الصحي
            </h2>

            <p class="login-subtitle-en">
                Fitness Tracking & Healthy Lifestyle Website
            </p>

          <form id="loginForm" class="login-form" action="php/login.php" method="POST">

                <div class="form-group">
                    <label for="email">البريد الإلكتروني | Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="أدخل البريد الإلكتروني"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور | Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        required>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <div class="login-buttons">
                    <button type="submit" class="btn btn-primary">
                        تسجيل الدخول | Login
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        إعادة تعيين | Reset
                    </button>
                </div>

            </form>

            <!-- رابط إنشاء حساب -->
            <div class="login-footer">
                <p>ليس لديك حساب؟ | Don't have an account?</p>
                <a href="register.html" class="btn btn-link">إنشاء حساب جديد | Create Account</a>
            </div>

            <!-- تم حذف قسم login-help هنا -->

        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
